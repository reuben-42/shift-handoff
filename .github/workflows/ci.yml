name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Layer contracts (import-linter)
        run: uv run lint-imports --no-cache
      - name: Tests (incl. planted-violation arch guard)
        run: uv run pytest
        env:
          LLM_PROVIDER: fake

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Layer rules (dependency-cruiser)
        run: npm run lint:arch
      - name: Arch guard (planted violations must fail)
        run: npm run arch-guard
      - name: Tests (Vitest)
        run: npm test
      - name: Build
        run: npx vite build
